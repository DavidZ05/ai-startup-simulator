services:
  game:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    environment:
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET to a random secret of at least 32 characters}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3001}"
      AUTO_CLEANUP: "false"
    volumes:
      - ./server/data:/app/data
    restart: unless-stopped
